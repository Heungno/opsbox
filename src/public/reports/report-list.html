<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>OpsBox | 점검 보고서</title>
  <script src="/shared/js/theme-init.js?v=20261121-system"></script>
  <link rel="stylesheet" href="/shared/css/app.css?v=20261123-report-panel" />
</head>

<body>
  <template id="page-content-template">
    <header class="header">
      <h1>점검 보고서 목록</h1>
      <p>왼쪽에서 서버를 고르면 그 서버의 보고서만, 고르지 않으면 목록에 보이는 서버 전체의 보고서를 보여 줍니다.</p>
    </header>

    <div class="template-workspace server-workspace">
      <section class="card template-list-panel">
        <div class="section-header"><h2>서버 목록</h2><div><button id="server-list-refresh" type="button" class="btn">새로고침</button></div></div>
        <div class="form-group"><label for="server-search">검색</label><input id="server-search" type="search" placeholder="ID, 이름, IP 검색" /></div>
        <!-- 역할 탭: 전체 + 공통코드 serverRoles -->
        <div id="server-picker-role-tabs" class="management-category-tabs server-role-tabs" role="tablist" aria-label="서버 역할"></div>
        <div id="server-picker-list" class="template-list"></div>
        <p id="server-picker-empty" class="policy-help" hidden>등록된 서버가 없습니다.</p>
      </section>

      <section class="card report-list-column">
        <div class="section-title"><h2 id="report-heading">보고서</h2></div>
        <form id="filter-form" class="report-filter-form">
          <div class="form-group report-filter-date">
            <label for="filter-start-date">시작일</label>
            <input id="filter-start-date" type="date" />
          </div>
          <div class="form-group report-filter-date">
            <label for="filter-end-date">종료일</label>
            <input id="filter-end-date" type="date" />
          </div>
          <div class="report-filter-actions">
            <button type="submit" class="btn btn-primary">검색</button>
            <button type="button" id="btn-reset" class="btn btn-secondary">초기화</button>
          </div>
        </form>
        <div id="report-summary" class="report-summary" aria-live="polite"></div>
        <div id="report-list" aria-live="polite"><p class="report-list-empty">조회중...</p></div>
      </section>
    </div>
  </template>

  <script type="module" src="/shared/js/common.js?v=20261122-layout"></script>
  <script type="module" src="/reports/report-list.js?v=20261123-report-panel"></script>
</body>

</html>
