<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>OpsBox | 내 정보</title>
  <script src="/shared/js/theme-init.js?v=20261121-system"></script>
  <link rel="stylesheet" href="/shared/css/app.css?v=20261123-task8" />
</head>
<body>
  <template id="page-content-template">
    <header class="header">
      <h1>내 정보</h1>
      <p>로그인한 계정의 표시 이름과 비밀번호를 바꿉니다.</p>
    </header>

    <section class="card account-card">
      <h2>기본 정보</h2>
      <form id="profile-form" class="account-form" novalidate>
        <div class="form-group">
          <label for="account-username">아이디</label>
          <input id="account-username" type="text" readonly />
        </div>
        <div class="form-group">
          <label for="account-display-name">표시 이름</label>
          <input id="account-display-name" type="text" maxlength="50" autocomplete="name" required />
          <p class="policy-help">사이드바와 변경 이력에 보이는 이름입니다. 50자까지 쓸 수 있습니다.</p>
        </div>
        <div class="account-actions">
          <button class="btn btn-primary" type="submit">이름 저장</button>
        </div>
      </form>
    </section>

    <section class="card account-card">
      <h2>비밀번호 변경</h2>
      <form id="password-form" class="account-form" novalidate>
        <input type="text" autocomplete="username" id="password-form-username" hidden />
        <div class="form-group">
          <label for="current-password">현재 비밀번호</label>
          <input id="current-password" type="password" autocomplete="current-password" required />
        </div>
        <div class="form-group">
          <label for="new-password">새 비밀번호</label>
          <input id="new-password" type="password" autocomplete="new-password" minlength="12" required />
          <p class="policy-help">12자 이상. 바꾸면 다른 브라우저·기기에 로그인된 세션은 끊깁니다.</p>
        </div>
        <div class="form-group">
          <label for="confirm-password">새 비밀번호 확인</label>
          <input id="confirm-password" type="password" autocomplete="new-password" required />
        </div>
        <p id="password-error" class="account-error" role="alert" hidden></p>
        <div class="account-actions">
          <button class="btn btn-primary" type="submit">비밀번호 변경</button>
        </div>
      </form>
    </section>
  </template>
  <script type="module" src="/shared/js/common.js?v=20261122-layout"></script>
  <script type="module" src="/account/account.js?v=20261122-account"></script>
</body>
</html>
