<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpsBox - Reports</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>

<body>
  <div class="layout">
    <div id="sidebar-container"></div>
    <main class="content">
      <div class="container">
        <header class="header">
          <h1>점검 보고서 목록</h1>
          <p>전체 서버의 점검 보고서 이력을 검색하고 조회할 수 있습니다.</p>
        </header>

        <!-- Search & Filter Card -->
        <section class="card">
          <form id="filter-form" style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;">
            <div class="form-group" style="flex: 1; min-width: 200px;">
              <label for="filter-server">서버 검색</label>
              <input id="filter-server" type="text" placeholder="서버 ID 또는 서버명..." />
            </div>

            <div class="form-group" style="width: 160px;">
              <label for="filter-start-date">시작일</label>
              <input id="filter-start-date" type="date" />
            </div>

            <div class="form-group" style="width: 160px;">
              <label for="filter-end-date">종료일</label>
              <input id="filter-end-date" type="date" />
            </div>

            <div style="display: flex; gap: 8px;">
              <button type="submit" class="btn btn-primary">검색</button>
              <button type="button" id="btn-reset" class="btn btn-secondary">초기화</button>
            </div>
          </form>
        </section>

        <!-- Reports List Table Card -->
        <section class="card">
          <div class="section-title">
            <h2>검색 결과 (<span id="report-count">0</span>건)</h2>
          </div>

          <table class="server-table">
            <thead>
              <tr>
                <th>점검일시</th>
                <th>서버</th>
                <th>유형</th>
                <th>OS</th>
                <th>상태</th>
                <th>CPU</th>
                <th>MEM</th>
                <th>DISK</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="report-list">
              <tr>
                <td colspan="9" style="text-align: center; color: var(--text-light); padding: 20px;">
                  조회중...
                </td>
              </tr>
            </tbody>
          </table>
        </section>
      </div>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/report-list.js"></script>
</body>

</html>
