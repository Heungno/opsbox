<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | OpsBox</title>
  <link rel="stylesheet" href="/shared/css/app.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background: #f3f5f8; }
    .login-card { width: min(100% - 32px, 400px); padding: 32px; background: white; border-radius: 12px; box-shadow: 0 8px 28px #18283b18; }
    .login-card h1 { margin: 0 0 8px; }
    .login-card p { color: #64748b; margin: 0 0 24px; }
    .login-card label { display: block; margin: 16px 0 6px; font-weight: 600; }
    .login-card input { box-sizing: border-box; width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .login-card button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 6px; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
    #message { min-height: 1.5em; margin-top: 12px; color: #b91c1c; }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>OpsBox 로그인</h1>
    <p>등록된 회원 계정으로 로그인하세요.</p>
    <form id="login-form">
      <label for="username">아이디</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">로그인</button>
      <div id="message" role="alert"></div>
    </form>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const requestedNext = params.get('next') || '/';
    const next = requestedNext.startsWith('/') && !requestedNext.startsWith('//') ? requestedNext : '/';
    fetch('/api/auth/me').then((response) => response.json()).then(({ user }) => { if (user) location.replace(next); });
    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const response = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: form.get('username'), password: form.get('password') }) });
      const result = await response.json();
      if (response.ok) location.replace(next);
      else document.getElementById('message').textContent = result.message || '로그인할 수 없습니다.';
    });
  </script>
</body>
</html>
