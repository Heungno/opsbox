<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark" />
  <title>OpsBox | 로그인</title>
  <script src="/shared/js/theme-init.js?v=20261121-csp"></script>
  <link rel="stylesheet" href="/shared/css/app.css?v=20261121-scheme">
</head>
<body>
  <div class="login-page">
    <aside class="login-aside">
      <span class="logo">OpsBox</span>
      <div>
        <h2>서버 정기 점검을 한 곳에서 기록하고 확인합니다.</h2>
        <p>점검 결과를 가져와 서버별 상태와 보고서로 정리합니다.</p>
      </div>
    </aside>
    <main class="login-main">
      <div class="login-card">
        <h1>로그인</h1>
        <p>등록된 계정으로 로그인하세요.</p>
        <form id="login-form">
          <div class="form-group">
            <label for="username">아이디</label>
            <input id="username" name="username" autocomplete="username" required autofocus>
          </div>
          <div class="form-group">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary">로그인</button>
          <div id="message" class="login-message" role="alert"></div>
        </form>
      </div>
    </main>
  </div>
  <script type="module" src="/login.js?v=20261121-csp"></script>
</body>
</html>
