<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpsBox - Server Detail</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>

<body>

  <div class="layout">
    <div id="sidebar-container"></div>
    <main class="content">
      <div class="container">
        <header class="header">
          <h1>Server Detail</h1>
          <p id="server-title">Loading...</p>
        </header>

        <main class="container">
          <section class="card">
            <div class="section-header">
              <h2>기본 정보</h2>
              <div id="health-summary"></div>
            </div>

            <table class="detail-table">
              <tbody>
                <tr>
                  <th>ID</th>
                  <td id="server-id"></td>
                </tr>
                <tr>
                  <th>이름</th>
                  <td id="server-name"></td>
                </tr>
                <tr>
                  <th>유형</th>
                  <td id="server-type"></td>
                </tr>
                <tr>
                  <th>OS</th>
                  <td id="server-os"></td>
                </tr>
                <tr>
                  <th>IP</th>
                  <td id="server-ip"></td>
                </tr>
                <tr>
                  <th>공용 폴더</th>
                  <td id="server-shared-path"></td>
                </tr>
                <tr>
                  <th>스크립트 경로</th>
                  <td id="server-script-path"></td>
                </tr>
                <tr>
                  <th>결과 경로</th>
                  <td id="server-result-path"></td>
                </tr>
              </tbody>
            </table>
          </section>

          <section class="card">
            <div class="section-header">
              <h2>점검 정책</h2>
              <button id="btn-save-policy" type="button" class="btn btn-primary">
                저장
              </button>
            </div>
            <div class="section-header">
              <h3>프로세스 점검</h3>
              <button id="btn-add-process" type="button" class="btn btn-small btn-primary">
                + 추가
              </button>
            </div>
            <div class="policy-header process-grid">
              <div>프로세스명</div>
              <div>관리</div>
            </div>
            <div id="process-container">
            </div>
            <div class="section-header">
              <h3>디렉토리 점검</h3>
              <button id="btn-add-directory" type="button" class="btn btn-small btn-primary">
                + 추가
              </button>
            </div>
            <div class="policy-header directory-grid">
              <div>디렉토리 경로</div>
              <div>경고 (%)</div>
              <div>위험 (%)</div>
              <div>관리</div>
            </div>
            <div id="directory-container">
            </div>
          </section>

          <section class="card">
            <h2>최근 점검 결과</h2>
            <div id="latest-result">조회중...</div>
          </section>

          <section class="card">
            <h2>점검 스크립트</h2>
            <div id="script-list">조회중...</div>
          </section>

          <section class="card">
            <h2>점검 이력</h2>
            <table class="history-table">
              <thead>
                <tr>
                  <th>점검일시</th>
                  <th>CPU</th>
                  <th>MEM</th>
                  <th>DISK</th>
                  <th>상태</th>
                  <th>리포트</th>
                </tr>
              </thead>
              <tbody id="result-history">
                <tr>
                  <td colspan="6">조회중...</td>
                </tr>
              </tbody>
            </table>
          </section>
      </div>

    </main>

  </div>

  <script src="/js/common.js"></script>
  <script src="/js/server-detail.js"></script>

</body>

</html>
