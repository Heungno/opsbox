<dialog id="code-dialog" class="modal-dialog common-code-entry-dialog">
  <section class="card modal-card">
    <div class="section-header">
      <h2 id="dialog-title">코드 추가</h2>
      <button id="dialog-close" class="btn" type="button" aria-label="닫기">닫기</button>
    </div>
    <form id="code-form">
      <div id="code-group-field" class="form-group" hidden><label for="code-group">그룹</label><select id="code-group"></select></div>
      <div class="form-group"><label for="code-value">코드 값</label><input id="code-value" required maxlength="120" /></div>
      <div class="form-group"><label for="code-label">표시명</label><input id="code-label" required maxlength="120" /></div>
      <div class="form-group"><label for="code-enabled">사용 여부</label><select id="code-enabled"><option value="true">사용</option><option value="false">미사용</option></select></div>
      <div class="form-group"><label for="code-order">정렬 순서</label><input id="code-order" type="number" value="0" /></div>
      <div class="button-area">
        <button id="dialog-cancel" class="btn" type="button">취소</button>
        <button class="btn btn-primary" type="submit">저장</button>
      </div>
    </form>
  </section>
</dialog>
