<dialog id="script-template-picker" class="modal-dialog script-template-picker">
  <section class="card modal-card">
    <div class="section-header">
      <div>
        <h2 id="script-template-picker-title">점검 스크립트 선택</h2>
        <p id="script-template-picker-label" class="policy-help"></p>
      </div>
      <button id="script-template-picker-close" type="button" class="btn" aria-label="닫기">닫기</button>
    </div>
    <div class="form-group">
      <label for="script-template-picker-select">사용할 스크립트</label>
      <select id="script-template-picker-select"></select>
    </div>
    <div id="db-query-template-option" class="form-group" hidden>
      <label for="db-query-template-select">DB 쿼리 템플릿</label>
      <select id="db-query-template-select"></select>
      <small id="db-query-template-help" class="template-help" hidden>Ctrl 또는 Shift 키를 누른 채 선택하면 여러 쿼리를 지정할 수 있습니다.</small>
    </div>
    <div class="button-area script-template-picker-tools">
      <button id="script-template-picker-edit" type="button" class="btn btn-small">선택 스크립트 수정</button>
      <button id="script-template-picker-refresh" type="button" class="btn btn-small">목록 새로고침</button>
    </div>
    <p class="policy-help">실행 쿼리는 쿼리 템플릿을 사용하는 스크립트에서만 선택할 수 있습니다. 여러 쿼리 선택은 기타 사용자 쿼리 항목에서 지원합니다. 정책 저장 후 적용됩니다.</p>
    <div class="button-area">
      <button id="script-template-picker-save" type="button" class="btn btn-primary">선택 적용</button>
      <button id="script-template-picker-cancel" type="button" class="btn">취소</button>
    </div>
  </section>
</dialog>
