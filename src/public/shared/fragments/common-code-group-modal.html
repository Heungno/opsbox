<dialog id="group-dialog" class="modal-dialog common-code-entry-dialog">
  <section class="card modal-card">
    <div class="section-header">
      <h2>그룹 추가</h2>
      <button id="group-dialog-close" class="btn" type="button" aria-label="닫기">닫기</button>
    </div>
    <form id="group-form">
      <div class="form-group"><label for="group-name">그룹명</label><input id="group-name" required maxlength="120" /></div>
      <div class="button-area">
        <button id="group-dialog-cancel" class="btn" type="button">취소</button>
        <button class="btn btn-primary" type="submit">추가</button>
      </div>
    </form>
  </section>
</dialog>
