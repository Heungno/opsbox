<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>OpsBox | 결과 수집</title>
  <script src="/shared/js/theme-init.js?v=20261121-system"></script>
  <link rel="stylesheet" href="/shared/css/app.css?v=20261123-task8" />
</head>
<body>
  <template id="page-content-template">
    <header class="header">
      <h1>결과 수집</h1>
      <p>점검 결과 파일이 OpsBox로 들어오는 경로를 정합니다.</p>
    </header>

    <section class="card account-card">
      <h2>수신함 (OpsBox가 가져가는 폴더)</h2>
      <p class="policy-help">OpsBox가 이 폴더 바로 아래의 결과 파일(.json)을 5분마다 가져갑니다. 가져간 파일은 암호화해 백업하고 지웁니다.</p>
      <ul id="inbox-list" class="result-path-list"></ul>
      <p class="policy-help">OpsBox 서버의 환경 변수 <code>OPSBOX_RESULT_INBOX</code>로 바꿉니다(여러 개는 <code>;</code>로 구분). 바꾼 뒤 OpsBox를 다시 시작하세요.</p>
    </section>

    <section class="card account-card">
      <h2>결과 저장 경로 기본값 (점검 대상 서버가 보는 경로)</h2>
      <p class="policy-help">점검 스크립트가 결과를 저장할 폴더입니다. 보통 수신함과 같은 공유 폴더를 대상 서버에서 본 경로로 적습니다. 서버마다 다르면 서버 정보에서 따로 지정하세요. 비워 두면 스크립트가 있는 폴더에 저장합니다.</p>
      <form id="result-path-form" class="account-form" novalidate>
        <div class="form-group">
          <label for="result-path-windows">Windows 서버</label>
          <input id="result-path-windows" type="text" placeholder="\\NAS01\opsbox\results" autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="result-path-linux">Linux 서버</label>
          <input id="result-path-linux" type="text" placeholder="/mnt/opsbox/results" autocomplete="off" />
        </div>
        <p id="result-path-error" class="account-error" role="alert" hidden></p>
        <div class="account-actions">
          <button class="btn btn-primary" type="submit">저장</button>
        </div>
      </form>
    </section>
  </template>
  <script type="module" src="/shared/js/common.js?v=20261122-layout"></script>
  <script type="module" src="/settings/result-collection/result-collection.js?v=20261122-result-collection"></script>
</body>
</html>
