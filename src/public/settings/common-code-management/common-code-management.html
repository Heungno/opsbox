<!doctype html>
<html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" /><title>OpsBox | 공통코드 관리</title><script src="/shared/js/theme-init.js?v=20261121-system"></script>
<link rel="stylesheet" href="/shared/css/app.css?v=20261122-mobile" /></head>
<body class="template-management-page"><template id="page-content-template">
  <header class="header"><h1>공통코드 관리</h1><p>코드 분류와 분류별 코드를 관리합니다.</p></header>
  <div class="template-workspace common-code-workspace">
    <section class="card template-list-panel">
      <div class="section-header"><h2>코드 분류</h2><button id="category-add" class="btn btn-primary" type="button">+ 분류 추가</button></div>
      <select id="category-select" class="common-code-category-select" aria-label="선택된 코드 분류"></select>
      <div id="category-list" class="template-list common-code-category-list" role="listbox" aria-label="코드 분류 목록"></div>
    </section>
    <section class="card template-editor-panel common-code-editor-panel">
      <div class="section-header"><h2 id="entry-heading">코드 목록</h2><div><button id="group-add" class="btn" type="button" hidden>+ 그룹 추가</button> <button id="entry-add" class="btn btn-primary" type="button">+ 코드 추가</button></div></div>
      <div class="table-wrap common-code-table-wrap"><table><thead><tr><th>코드</th><th>표시명</th><th>사용 여부</th><th>정렬 순서</th><th>관리</th></tr></thead><tbody id="codes-table"></tbody></table></div>
      <p id="codes-empty" class="policy-help" hidden>등록된 코드가 없습니다.</p><p id="codes-message" class="policy-help" role="status"></p>
    </section>
  </div>
  <div id="code-dialog-container"></div>
  <div id="category-dialog-container"></div>
  <div id="group-dialog-container"></div>
</template><script type="module" src="/shared/js/common.js?v=20261122-layout"></script><script type="module" src="/settings/common-code-management/common-code-management.js?v=20261122-layout"></script></body></html>
