<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>OpsBox | 스크립트 관리</title>
  <script src="/shared/js/theme-init.js?v=20261121-system"></script>
  <link rel="stylesheet" href="/shared/css/app.css?v=20261122-account" />
</head>
<body class="template-management-page">
  <template id="page-content-template">
      <header class="header"><h1>스크립트 관리</h1><p>운영체제별 점검 스크립트와 DB 쿼리를 관리하고 서버 정책의 점검영역에 연결합니다.</p></header>
      <div class="template-workspace">
      <section class="card template-list-panel">
        <div class="section-header"><h2>저장된 템플릿</h2><button type="button" id="btn-template-reset" class="btn btn-primary">+ 템플릿 추가</button></div>
        <div class="template-filters">
          <select id="template-item-filter" hidden></select>
          <div class="form-group"><label for="template-filter">종류</label><select id="template-filter" aria-label="템플릿 종류 필터"></select></div>
          <div class="form-group"><label for="template-os-filter">운영체제</label><select id="template-os-filter" aria-label="운영체제 필터"></select></div>
        </div>
        <div id="template-group-tabs" class="management-category-tabs" role="tablist" aria-label="스크립트 영역">
          <button type="button" role="tab" data-group="ALL" aria-selected="true">전체 <span>0</span></button>
          <button type="button" role="tab" data-group="COMMON" aria-selected="false">공통 <span>0</span></button>
          <button type="button" role="tab" data-group="WEB" aria-selected="false">WEB <span>0</span></button>
          <button type="button" role="tab" data-group="WAS" aria-selected="false">WAS <span>0</span></button>
          <button type="button" role="tab" data-group="DB" aria-selected="false">DB <span>0</span></button>
          <button type="button" role="tab" data-group="SYSTEM" aria-selected="false">시스템 <span>0</span></button>
        </div>
        <div id="template-list" class="template-list"></div>
      </section>
      <section class="card template-editor-panel">
      <div class="section-header"><h2 id="template-form-title">새 템플릿</h2><div class="button-area"><button type="button" id="btn-template-history" class="btn" hidden>변경 이력</button></div></div>
        <form id="template-form">
          <div class="form-grid">
            <div class="form-group"><label for="template-name">이름</label><input id="template-name" required placeholder="예: Windows WEB 기본 점검" /></div>
            <div class="form-group"><label for="template-kind">종류</label><select id="template-kind"></select></div>
            <div class="form-group template-script-option"><label for="template-os">운영체제</label><select id="template-os"></select></div>
            <div class="form-group template-part-option" hidden><select id="template-item"></select></div>
            <div class="form-group template-query-dbms-option" hidden><label for="template-dbms">DBMS 종류</label><select id="template-dbms"></select></div>
            <label class="template-enabled template-query-option" hidden><input id="template-uses-query" type="checkbox" /> 실행 쿼리 템플릿 사용</label>
            <div class="form-group template-script-option template-target-option"><label for="template-role">대상 역할 (선택)</label><select id="template-role"></select></div>
            <div class="form-group template-script-option template-target-option"><label for="template-product">대상 제품 (선택)</label><input id="template-product" placeholder="예: WebtoB" /></div>
            <label class="template-enabled"><input id="template-enabled" type="checkbox" checked /> 사용</label>
          </div>
          <div class="form-group template-content-group"><label for="template-content">템플릿 내용</label><div class="template-content-layout"><div class="template-editor"><pre id="template-highlight" aria-hidden="true"><code></code></pre><textarea id="template-content" required spellcheck="false" wrap="off" aria-label="템플릿 코드"></textarea></div><aside class="template-output-example"><h3>JSON 결과 예시</h3><pre id="template-output-example"></pre><small>점검 결과에 포함되는 항목 구조입니다.</small></aside></div></div>
          <div id="template-help" class="template-help"></div>
          <div class="button-area"><button id="btn-template-save" type="submit" class="btn btn-primary">템플릿 저장</button></div>
        </form>
      </section>
      </div>
  </template>
  <dialog id="unsaved-template-dialog" class="modal-dialog unsaved-template-dialog">
    <section class="card modal-card">
      <div class="section-header"><h2>저장하지 않은 변경사항</h2></div>
      <p id="unsaved-template-message" class="policy-help">현재 템플릿에 저장하지 않은 변경사항이 있습니다.</p>
      <div class="button-area">
        <button id="unsaved-template-save-open" type="button" class="btn btn-primary">저장 후 열기</button>
        <button id="unsaved-template-discard-open" type="button" class="btn">저장하지 않고 열기</button>
        <button id="unsaved-template-continue" type="button" class="btn">계속 편집</button>
      </div>
    </section>
  </dialog>
  <dialog id="template-history-dialog" class="modal-dialog">
    <section class="card modal-card">
      <div class="section-header"><h2>템플릿 변경 이력</h2><button type="button" id="template-history-close" class="btn">닫기</button></div>
      <p class="policy-help">내용을 저장하기 전 버전을 선택해 복원할 수 있습니다. 복원 전 현재 내용도 이력에 보관됩니다.</p>
      <div id="template-history-list" class="template-list"></div>
    </section>
  </dialog>
  <script type="module" src="/shared/js/common.js?v=20261122-layout"></script>
  <script type="module" src="/settings/script-management/script-management.js?v=20261122-layout"></script>
</body>
</html>
