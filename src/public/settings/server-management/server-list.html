<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />

  <title>OpsBox | 서버 관리</title>

  <script src="/shared/js/theme-init.js?v=20261121-system"></script>
  <link rel="stylesheet" href="/shared/css/app.css?v=20261123-task7" />
</head>

<body>
  <template id="page-content-template">
    <!-- Dashboard -->
    <header class="header">
      <h1>서버 관리</h1>
      <p>서버 정보를 등록하고 유형별 점검 정책을 관리합니다.</p>
    </header>
    <!-- 요약 카드: 전체 + 역할별(공통코드 serverRoles) -->
    <section id="server-summary" class="card dashboard"></section>

    <!-- Server List -->
    <section class="card">
      <div class="section-title">
        <h2>서버 목록</h2>
        <div class="server-list-actions">
          <button type="button" id="btn-new" class="btn btn-primary">신규 서버</button>
          <input id="search" type="text" placeholder="검색..." />
          <label class="checkbox-label"><input id="show-inactive" type="checkbox" /> 미사용 포함</label>
        </div>
      </div>
      <!-- 역할 탭: 전체 + 공통코드 serverRoles -->
      <div id="server-role-tabs" class="management-category-tabs server-role-tabs" role="tablist" aria-label="서버 역할"></div>
      <table class="server-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>이름</th>
            <th>유형</th>
            <th>OS</th>
            <th>IP</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="server-list"></tbody>
      </table>
    </section>

    <div id="server-modal-container"></div>
  </template>
  <script type="module" src="/shared/js/common.js?v=20261122-layout"></script>
  <script type="module" src="/settings/server-management/server-list.js?v=20261122-layout"></script>
</body>

</html>
