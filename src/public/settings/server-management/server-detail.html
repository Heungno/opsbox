<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>OpsBox | 서버 상세</title>
  <script src="/shared/js/theme-init.js?v=20261121-system"></script>
  <link rel="stylesheet" href="/shared/css/app.css?v=20261122-account" />
</head>

<body class="server-management-page">
  <template id="page-content-template">
    <header class="header"><h1>서버 관리</h1><p id="server-title">서버를 선택해 정보와 점검 정책을 관리합니다.</p></header>

    <div class="template-workspace server-workspace">
    <section class="card template-list-panel">
      <div class="section-header"><h2>서버 목록</h2><div><button id="server-add" type="button" class="btn btn-primary">+ 서버 추가</button> <button id="server-list-refresh" type="button" class="btn">새로고침</button></div></div>
      <div class="form-group"><label for="server-search">검색</label><input id="server-search" type="search" placeholder="ID, 이름, IP 검색" /></div>
      <div id="server-picker-role-tabs" class="management-category-tabs server-role-tabs" role="tablist" aria-label="서버 역할">
        <button type="button" role="tab" data-role="ALL" aria-selected="true">전체 <span>0</span></button>
        <button type="button" role="tab" data-role="WEB" aria-selected="false">WEB <span>0</span></button>
        <button type="button" role="tab" data-role="WAS" aria-selected="false">WAS <span>0</span></button>
        <button type="button" role="tab" data-role="DB" aria-selected="false">DB <span>0</span></button>
        <button type="button" role="tab" data-role="OTHER" aria-selected="false">기타 <span>0</span></button>
      </div>
      <div id="server-picker-list" class="template-list"></div>
      <p id="server-picker-empty" class="policy-help" hidden>등록된 서버가 없습니다.</p>
    </section>
    <div class="server-editor-column">
    <section id="server-inactive-banner" class="card server-inactive-banner" hidden>
      <p><strong>미사용 서버입니다.</strong> 대시보드·스크립트 내려받기·결과 가져오기에서 빠지고, 점검 결과와 보고서는 남아 있습니다.</p>
      <button id="btn-activate-server" type="button" class="btn btn-primary btn-small">다시 사용</button>
    </section>
    <nav class="server-detail-tabs" role="tablist" aria-label="서버 상세 메뉴">
      <button type="button" role="tab" data-server-tab="overview" aria-selected="true">개요</button>
      <button type="button" role="tab" data-server-tab="policy" aria-selected="false">점검 정책</button>
      <button type="button" role="tab" data-server-tab="scripts" aria-selected="false">점검 스크립트</button>
    </nav>

    <div class="server-panels">
      <section class="card" data-server-panel="overview">
        <div class="section-header">
          <h2>기본 정보</h2>
          <div class="button-area">
            <div id="health-summary"></div>
            <button id="btn-edit-server" type="button" class="btn btn-primary">정보 수정</button>
          </div>
        </div>

        <table class="detail-table">
          <tbody>
            <tr>
              <th>ID</th>
              <td id="server-id"></td>
            </tr>
            <tr>
              <th>이름</th>
              <td id="server-name"></td>
            </tr>
            <tr>
              <th>유형</th>
              <td id="server-type"></td>
            </tr>
            <tr><th>제품</th><td id="server-product"></td></tr>
            <tr>
              <th>OS</th>
              <td id="server-os"></td>
            </tr>
            <tr>
              <th>IP</th>
              <td id="server-ip"></td>
            </tr>
            <tr>
              <th>결과 저장 경로</th>
              <td id="server-result-path"></td>
            </tr>
            <tr>
              <th>OpsBox 수신함</th>
              <td id="server-inbox-path"></td>
            </tr>
          </tbody>
        </table>
        <div class="server-overview-checks">
          <section class="server-overview-latest">
            <h3>최근 점검 결과</h3>
            <div id="latest-result">조회중...</div>
          </section>
          <section class="server-overview-history">
            <div class="overview-heading">
              <h3>최근 점검 기록</h3>
              <button id="btn-upload-result" type="button" class="btn btn-small btn-secondary" title="점검자가 내려받은 결과 JSON 파일을 올립니다">결과 파일 올리기</button>
              <input id="upload-result-input" type="file" accept=".json,application/json" multiple hidden>
            </div>
            <table class="history-table compact-history-table">
              <thead><tr><th>점검일시</th><th>CPU</th><th>MEM</th><th>DISK</th><th>상태</th><th>보고서</th></tr></thead>
              <tbody id="result-history"><tr><td colspan="6">조회중...</td></tr></tbody>
            </table>
          </section>
        </div>
      </section>

      <div id="server-modal-container"></div>
      <div id="script-template-picker-container"></div>

      <section class="card" id="policy-section" data-server-panel="policy" hidden>
        <div class="section-header">
          <h2>점검 정책</h2>
          <button id="btn-save-policy" type="button" class="btn btn-primary">
            정책 저장
          </button>
        </div>
        <nav id="policy-role-tabs" class="server-detail-tabs policy-role-tabs" role="tablist" aria-label="역할별 점검 정책"></nav>
        <div id="common-basic-policy-group" class="policy-category-group" data-policy-role-panel="BASIC">
        <div class="section-header policy-category-heading"><h3>기본점검 정책 항목</h3></div>
        <div class="policy-script-controls policy-source-controls">
          <label for="basic-policy-source">기본 정책 불러오기</label>
          <select id="basic-policy-source" aria-label="기본 정책 선택"><option value="">정책 선택</option></select>
          <button id="basic-policy-apply" type="button" class="btn btn-small">적용</button>
        </div>
        <div id="basic-policy-items" class="policy-category-items"></div>
        <section id="common-script-policy" class="policy-section">
          <div class="section-header policy-section-heading"><h3>자원 기본 점검</h3></div>
          <p class="policy-help">CPU·메모리·가동시간·디스크 항목은 기본 점검에 포함됩니다. 각 항목에서 사용할 스크립트를 선택하세요.</p>
          <div id="common-script-controls" class="policy-script-controls"></div>
        </section>
        <section class="policy-section">
          <div class="section-header policy-section-heading">
            <h3>프로세스 점검</h3>
            <div class="policy-heading-actions"><div id="process-script-control"></div><button id="btn-add-process" type="button" class="btn btn-small btn-primary">+ 프로세스 추가</button></div>
          </div>
          <div class="policy-header process-grid"><div>프로세스명</div><div>관리</div></div>
          <div id="process-container"></div>
        </section>
        <section class="policy-section">
          <div class="section-header policy-section-heading">
            <h3>디렉토리 점검</h3>
            <div class="policy-heading-actions"><div id="directory-script-control"></div><button id="btn-add-directory" type="button" class="btn btn-small btn-primary">+ 디렉토리 추가</button></div>
          </div>
          <div class="policy-header directory-grid"><div>디렉토리 경로</div><div>경고 (%)</div><div>위험 (%)</div><div>관리</div></div>
          <div id="directory-container"></div>
        </section>
        <section class="policy-section">
          <div class="section-header policy-section-heading">
            <h3>특정 파일 크기 점검</h3>
            <div class="policy-heading-actions"><div id="file-script-control"></div><button id="btn-add-file-check" type="button" class="btn btn-small btn-primary">+ 파일 추가</button></div>
          </div>
          <p class="policy-help">파일 경로와 경고·위험 기준 크기(MB)를 설정합니다. 파일이 없으면 위험으로 표시됩니다.</p>
          <div class="policy-header file-check-grid"><div>파일 경로</div><div>경고 (MB)</div><div>위험 (MB)</div><div>관리</div></div>
          <div id="file-check-container"></div>
        </section>
        <section class="policy-section">
          <div class="section-header policy-section-heading">
            <h3>포트 리스닝 점검</h3>
            <div class="policy-heading-actions"><div id="port-script-control"></div><button id="btn-add-port" type="button" class="btn btn-small btn-primary">+ 포트 추가</button></div>
          </div>
          <p class="policy-help">정책에 등록한 포트가 서버에서 대기(Listen/Bound) 중인지 확인합니다. 미수신 포트는 위험으로 표시됩니다.</p>
          <div class="policy-header port-grid"><div>프로토콜</div><div>포트</div><div>설명</div><div>관리</div></div>
          <div id="port-container"></div>
        </section>
        <section class="policy-section" id="http-check-policy">
          <div class="section-header policy-section-heading">
            <h3>HTTP 응답 점검</h3>
            <div class="policy-heading-actions"><div id="http-script-control"></div><button id="btn-add-http-check" type="button" class="btn btn-small btn-primary">+ HTTP 점검 추가</button></div>
          </div>
          <p class="policy-help">WEB/WAS에서 지정 URL에 접속해 HTTP 상태 코드가 기대값과 일치하는지 확인합니다. Windows 스크립트 기준으로 응답 제한 시간은 10초입니다.</p>
          <div class="policy-header http-check-grid"><div>점검명</div><div>URL</div><div>기대 코드</div><div>관리</div></div>
          <div id="http-check-container"></div>
        </section>
        </div>
        <section id="web-role-policy" class="policy-category-group role-policy-block" data-policy-role-panel="WEB" hidden>
          <div class="section-header policy-category-heading"><h3 id="web-role-policy-title">WEB 점검</h3></div>
          <div class="policy-script-controls policy-source-controls"><label for="web-policy-source">WEB 정책 불러오기</label><select id="web-policy-source"><option value="">정책 선택</option></select><button type="button" class="btn btn-small" data-policy-apply="WEB">적용</button></div>
          <p class="policy-help">웹 엔진 상태, WEB-WAS 연동, 요청 처리량, 로그를 점검 항목으로 관리합니다.</p>
          <div id="web-role-policy-controls"></div>
        </section>
        <section id="was-role-policy" class="policy-category-group role-policy-block" data-policy-role-panel="WAS" hidden>
          <div class="section-header policy-category-heading"><h3 id="was-role-policy-title">WAS 점검</h3></div>
          <div class="policy-script-controls policy-source-controls"><label for="was-policy-source">WAS 정책 불러오기</label><select id="was-policy-source"><option value="">정책 선택</option></select><button type="button" class="btn btn-small" data-policy-apply="WAS">적용</button></div>
          <p class="policy-help">JVM, Thread/Connection Pool, 배포 상태와 Dump·기동 설정을 점검 항목으로 관리합니다.</p>
          <div id="was-role-policy-controls"></div>
        </section>
        <section id="db-role-policy" class="policy-category-group role-policy-block" data-policy-role-panel="DB" hidden>
          <div class="section-header policy-category-heading"><h3 id="db-role-policy-title">DB 점검</h3></div>
          <div class="policy-script-controls policy-source-controls"><label for="db-policy-source">DB 정책 불러오기</label><select id="db-policy-source"><option value="">정책 선택</option></select><button type="button" class="btn btn-small" data-policy-apply="DB">적용</button></div>
          <p class="policy-help">DB 접속·세션, 데이터·트랜잭션 로그, 백업·복제 상태를 점검하고, MSSQL 사용자 쿼리 항목에서는 여러 쿼리 템플릿을 실행할 수 있습니다.</p>
          <div id="db-role-policy-controls"></div>
        </section>
        <details class="server-final-json-preview">
          <summary>최종 점검 결과 JSON 구조 보기</summary>
          <pre id="server-final-json-example" aria-label="최종 점검 결과 JSON 예시"></pre>
        </details>
      </section>

      <section class="card" data-server-panel="scripts" hidden>
        <h2>점검 스크립트</h2>
        <div id="script-list">조회중...</div>
      </section>
    </div>
    </div>
    </div>
  </template>

  <script type="module" src="/shared/js/common.js?v=20261122-layout"></script>
  <script type="module" src="/settings/server-management/server-detail.js?v=20261122-layout"></script>

</body>

</html>
