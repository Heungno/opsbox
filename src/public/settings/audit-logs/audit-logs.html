<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpsBox | 변경 이력</title>
  <link rel="stylesheet" href="/shared/css/app.css?v=20261121-design" />
</head>
<body>
  <div id="shared-layout-root"></div>
  <template id="page-content-template">
    <header class="header">
      <h1>변경 이력</h1>
      <p>로그인, 서버·정책·템플릿·공통코드 변경, 점검 결과 가져오기, 스크립트 다운로드 기록입니다.</p>
    </header>

    <section class="card">
      <form id="audit-filter" class="audit-filter">
        <div class="form-group">
          <label for="audit-from">시작일</label>
          <input id="audit-from" type="date" />
        </div>
        <div class="form-group">
          <label for="audit-to">종료일</label>
          <input id="audit-to" type="date" />
        </div>
        <div class="form-group">
          <label for="audit-action">작업</label>
          <select id="audit-action"><option value="">전체</option></select>
        </div>
        <div class="form-group">
          <label for="audit-user">사용자</label>
          <input id="audit-user" type="text" placeholder="아이디" autocomplete="off" />
        </div>
        <div class="form-group audit-filter-wide">
          <label for="audit-q">대상·내용</label>
          <input id="audit-q" type="search" placeholder="서버 ID, 정책명 등" autocomplete="off" />
        </div>
        <div class="audit-filter-buttons">
          <button class="btn btn-primary" type="submit">조회</button>
          <button id="audit-reset" class="btn" type="button">초기화</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="section-header">
        <h2>기록 <span id="audit-total" class="audit-total"></span></h2>
      </div>
      <div class="table-scroll">
        <table class="audit-table">
          <thead>
            <tr><th>일시</th><th>사용자</th><th>작업</th><th>대상</th><th>내용</th><th>IP</th></tr>
          </thead>
          <tbody id="audit-rows"></tbody>
        </table>
      </div>
      <p id="audit-empty" class="policy-help" hidden>조건에 맞는 기록이 없습니다.</p>
      <div class="audit-pager">
        <button id="audit-prev" class="btn btn-small" type="button">이전</button>
        <span id="audit-page"></span>
        <button id="audit-next" class="btn btn-small" type="button">다음</button>
      </div>
    </section>
  </template>
  <script type="module" src="/shared/js/common.js?v=20261121-audit"></script>
  <script type="module" src="/settings/audit-logs/audit-logs.js?v=20261121-audit"></script>
</body>
</html>
